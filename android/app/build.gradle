plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.codexmobile.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.codexmobile.app"
        minSdk 29          // Android 10+
        targetSdk 36       // Android 15
        // versionCode/versionName 由 Flutter Gradle 插件从 pubspec.yaml 读取，
        // CI 构建时用 --build-number / --build-name 覆盖，保证每次构建单调递增，
        // 使 Android 可以覆盖安装（无需卸载）。
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // NDK/ABI 过滤 — 只构建 arm64-v8a
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        profile {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            // TODO: Sprint 9 — 配置正式签名
        }
    }

    // ── JNI / CMake 配置 ──
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.18.1"
        }
    }

    // ── jniLibs（App 内置原生工具：busybox）──
    // useLegacyPackaging = true 保证 .so 在安装时真实解压到
    // nativeLibraryDir（/data/app/<pkg>/lib/arm64，系统保证可执行），
    // 供 Dart/Kotlin 以符号链接或直接路径执行 —— 这是 Android 上
    // 唯一不受 filesDir noexec / SELinux 限制的可执行区域。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.18.1"
        }
    }

    // ── 从 assets 解压 BusyBox 到 $filesDir（通过 Kotlin 代码完成） ──
    // assets 目录已包含 busybox-arm64 占位文件
}

flutter {
    source '../..'
}

dependencies {
    // Kotlin 标准库
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // AndroidX 核心
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // 前台服务（后台运行）
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Material 3 组件
    implementation 'com.google.android.material:material:1.12.0'

    // Kotlin 协程（PtyPlugin 使用 CoroutineScope + SupervisorJob）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
