# ============================================================
#  Codex Mobile Pro — CI Pipeline
#  每次 push / pull_request 自动运行：
#   1. Flutter Analyze (静态分析 + 风格检查)
#   2. Flutter Test (单元测试 + Widget 测试)
#   3. Android Debug Build
# ============================================================

name: CI

on:
  push:
    branches: [main, develop, 'sprint-*']
  pull_request:
    branches: [main]

# 同分支连续 push 自动取消旧 run，避免排队等待（压缩端到端时间）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  #  Job 1: 静态分析
  # ============================================================
  analyze:
    name: 🔍 Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

  # ============================================================
  #  Job 2: 测试
  # ============================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter expanded

  # ============================================================
  #  Job 3: Android Debug Build
  # ============================================================
  build-android:
    name: 📦 Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore fixed debug keystore (stable signing across builds)
        run: |
          mkdir -p "$HOME/.android"
          cp android/debug.keystore "$HOME/.android/debug.keystore"
          # 固定签名指纹（SHA256）用于核对每次构建使用同一密钥
          sha256sum "$HOME/.android/debug.keystore"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Install CMake (for native pty library)
        run: |
          # GitHub Actions Ubuntu runner 预装 Android SDK，
          # 但 CMake 3.18.1 需要手动安装
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            echo "Installing CMake 3.18.1 via sdkmanager..."
            yes | "$SDKMANAGER" "cmake;3.18.1" > /dev/null 2>&1 || true
            echo "CMake installed at: $SDK_ROOT/cmake/3.18.1"
          else
            echo "sdkmanager not found at $SDKMANAGER, trying apt..."
            sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          fi
          cmake --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        # versionCode = GitHub Actions run number（每次运行严格递增），
        # 配合固定 keystore 实现无缝覆盖升级（无需卸载重装）。
        run: flutter build apk --debug --build-number=${{ github.run_number }} --build-name=1.0.0

      - name: Verify APK signature (must match fixed keystore)
        run: |
          EXPECTED="b1307e1488fe7cad36f0cac5ab2d1f0ce581e0c06afc74d391584a6bf2b93dd3"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "⚠️  apksigner 未找到，跳过签名校验"
            exit 0
          fi
          ACTUAL=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk \
            | grep "certificate SHA-256 digest" | awk '{print $NF}')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ APK 签名证书与固定 keystore 不匹配！覆盖安装会失败。"
            exit 1
          fi
          echo "✅ APK 签名证书匹配固定 keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk

  # ============================================================
  #  Job 4: 构建报告
  # ============================================================
  report:
    name: 📋 Report
    needs: [analyze, test, build-android]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "## 📋 CI Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Analyze | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Android Build | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
