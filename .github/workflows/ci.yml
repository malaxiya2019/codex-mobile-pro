# ============================================================
#  Codex Mobile Pro — CI Pipeline
#  每次 push / pull_request 自动运行：
#   1. Flutter Analyze (静态分析 + 风格检查)
#   2. Flutter Test (单元测试 + Widget 测试)
#   3. Android Debug Build
# ============================================================

name: CI

on:
  push:
    branches: [main, develop, 'sprint-*']
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  #  Job 1: 静态分析
  # ============================================================
  analyze:
    name: 🔍 Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

  # ============================================================
  #  Job 2: 测试
  # ============================================================
  test:
    name: 🧪 Tests
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests (visible output)
        run: |
          flutter test --reporter expanded
          TEST_EXIT=$?
          flutter test --machine > test_report.json || true
          exit $TEST_EXIT

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test_report.json

  # ============================================================
  #  Job 3: Android Debug Build
  # ============================================================
  build-android:
    name: 📦 Android Debug Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install CMake (for native pty library)
        run: |
          # GitHub Actions Ubuntu runner 预装 Android SDK，
          # 但 CMake 3.18.1 需要手动安装
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            echo "Installing CMake 3.18.1 via sdkmanager..."
            yes | "$SDKMANAGER" "cmake;3.18.1" > /dev/null 2>&1 || true
            echo "CMake installed at: $SDK_ROOT/cmake/3.18.1"
          else
            echo "sdkmanager not found at $SDKMANAGER, trying apt..."
            sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          fi
          cmake --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # ============================================================
  #  Job 4: 构建报告
  # ============================================================
  report:
    name: 📋 Report
    needs: [analyze, test, build-android]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "## 📋 CI Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Analyze | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Android Build | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
